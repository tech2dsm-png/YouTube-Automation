name: Daily YouTube Scheduler (7 AM IST)

on:
  schedule:
    - cron: '30 1 * * *'  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    name: Execute YouTube Upload Pipeline
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib pandas python-dotenv gspread oauth2client

      - name: Create Credentials Files from Secrets
        run: |
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > src/client_secrets.json
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > src/service_account.json

      - name: Run YouTube Executor
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_YOUTUBE_TOKEN: ${{ secrets.GOOGLE_YOUTUBE_TOKEN }}
          DB_PATH: youtube_master.db
          METADATA_CSV: metadata.csv
        run: python src/uploader.py

      - name: Sync Changes Back to GitHub
        run: |
          # 1. Force Git to forget the temporary JSON files
          rm -f src/client_secrets.json src/service_account.json
          git checkout src/  # This resets the folder state
          
          # 2. Setup Bot Identity
          git config --global user.name "SankalanAI-Bot"
          git config --global user.email "tech2dsm@gmail.com"
          
          # 3. Rebase and Push
          git pull origin main --rebase
          git add -f youtube_master.db metadata.csv
          
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "chore: automated sync [skip ci]"
            git push origin main
          else
            echo "No changes to sync."
          fi
name: Daily YouTube Scheduler (7 AM IST)

on:
  schedule:
    # 01:30 UTC is exactly 07:00 AM IST
    - cron: '30 1 * * *'  
  workflow_dispatch:      # Allows you to click "Run workflow" manually for testing

permissions:
  contents: write         # Required to push the updated .db back to your repo

jobs:
  upload:
    name: Execute YouTube Upload Pipeline
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          else
            pip install google-api-python-client google-auth-oauthlib pandas
          fi

      - name: Create Credentials Files from Secrets
        # We place these in src/ so uploader.py can find them in its own directory
        run: |
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > src/client_secrets.json
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > src/service_account.json

      - name: Run YouTube Executor
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          # Pathing for the script to locate the JSON files we just created
          CLIENT_SECRETS_PATH: src/client_secrets.json
          SERVICE_ACCOUNT_PATH: src/service_account.json
          GOOGLE_YOUTUBE_TOKEN: ${{ secrets.GOOGLE_YOUTUBE_TOKEN }}
          DB_PATH: youtube_master.db
          METADATA_CSV: metadata.csv
        # Run the script from the root while targeting the src subfolder
        run: python src/uploader.py

      - name: Sync Changes Back to GitHub
        run: |
          git config --global user.name "SankalanAI-Bot"
          git config --global user.email "tech2dsm@gmail.com"
          
          # Pull any changes first to avoid conflicts
          git pull origin main --rebase
          
          # CRITICAL FIX: Use -f to bypass .gitignore for the database
          git add -f youtube_master.db metadata.csv
          
          # Only commit if there are actual changes
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "chore: automated sync [skip ci]"
            git push origin main
          else
            echo "No changes detected in database."
          fi
name: Daily YouTube Scheduler (7 AM IST)

on:
  schedule:
    - cron: '30 1 * * *'  
  workflow_dispatch:      

permissions:
  contents: write         

jobs:
  upload:
    name: Execute YouTube Upload Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib pandas python-dotenv gspread oauth2client

      - name: Create Credentials Files from Secrets
        run: |
          # Create the credentials folder for Google Sheets sync
          mkdir -p credentials
          
          # Place the YouTube client secret in src
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > src/client_secrets.json
          
          # Place the Google Sheets service account in the path the script expects
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > credentials/service-account.json

      - name: Run YouTube Executor
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          CLIENT_SECRETS_PATH: src/client_secrets.json
          # FIXED: Changed from SERVICE_ACCOUNT_PATH to SERVICE_ACCOUNT_JSON to match your script
          SERVICE_ACCOUNT_JSON: credentials/service-account.json
          GOOGLE_YOUTUBE_TOKEN: ${{ secrets.GOOGLE_YOUTUBE_TOKEN }}
          DB_PATH: youtube_master.db
          METADATA_CSV: metadata.csv
        run: python src/uploader.py

      - name: Sync Changes Back to GitHub
        run: |
          # 1. Setup Identity
          git config --global user.name "SankalanAI-Bot"
          git config --global user.email "tech2dsm@gmail.com"

          # 2. THE FORCE CLEANUP
          # Remove credentials so they are never committed to GitHub
          rm -f src/client_secrets.json
          rm -rf credentials/
          
          # 3. Handle Git state
          git reset --hard HEAD
          git clean -fd

          # 4. Pull latest using Autostash to handle the updated DB
          git pull origin main --rebase --autostash
          
          # 5. Save the modified database/csv
          git add -f youtube_master.db metadata.csv
          
          # 6. Commit and Push
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "chore: automated sync [skip ci]"
            git push origin main
          else
            echo "No changes detected to sync."
          fi
name: Daily YouTube Scheduler (7 AM IST)

on:
  schedule:
    - cron: '30 1 * * *'  
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  upload:
    name: Execute YouTube Upload Pipeline
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          else
            pip install google-api-python-client google-auth-oauthlib pandas
          fi

      - name: Create Credentials Files from Secrets
        # This step turns your text secrets into real .json files the script can read
        run: |
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Run YouTube Executor
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          # Point the script to the files we just created above
          CLIENT_SECRETS_PATH: client_secrets.json
          SERVICE_ACCOUNT_PATH: service_account.json
          # Pass the Refresh Token directly as a string
          GOOGLE_YOUTUBE_TOKEN: ${{ secrets.GOOGLE_YOUTUBE_TOKEN }}
          DB_PATH: youtube_master.db
          METADATA_CSV: metadata.csv
        run: python uploader.py

      - name: Sync Changes Back to GitHub
        run: |
          git config --global user.name "SankalanAI-Bot"
          git config --global user.email "tech2dsm@gmail.com"
          
          git pull origin main --rebase
          
          # CRITICAL: Add the .db file here so GitHub "remembers" what it uploaded
          git add metadata.csv youtube_master.db
          
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "chore: automated sync [skip ci]"
            git push origin main
          else
            echo "No changes detected."
          fi
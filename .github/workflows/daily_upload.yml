name: Daily YouTube Scheduler (7 AM IST)

on:
  schedule:
    - cron: '30 1 * * *'  
  workflow_dispatch:      

permissions:
  contents: write         

jobs:
  upload:
    name: Execute YouTube Upload Pipeline
    runs-on: ubuntu-latest
    
    steps:
      # STEP 1: Get the code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # STEP 2: Prepare the language
      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # STEP 3: Install tools (Order: Must happen before running the script)
      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib pandas python-dotenv gspread oauth2client

      # STEP 4: Create temporary keys (Order: Must happen before script runs)
      - name: Create Credentials Files from Secrets
        run: |
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > src/client_secrets.json
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > src/service_account.json

      # STEP 5: DO THE WORK (Order: This changes the .db and .csv files)
      - name: Run YouTube Executor
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          CLIENT_SECRETS_PATH: src/client_secrets.json
          SERVICE_ACCOUNT_PATH: src/service_account.json
          GOOGLE_YOUTUBE_TOKEN: ${{ secrets.GOOGLE_YOUTUBE_TOKEN }}
          DB_PATH: youtube_master.db
          METADATA_CSV: metadata.csv
        run: python src/uploader.py

      # STEP 6: SAVE THE WORK (Order: MUST be last to capture the changes from Step 5)
      - name: Sync Changes Back to GitHub
        run: |
          # 1. Identify the Bot
          git config --global user.name "SankalanAI-Bot"
          git config --global user.email "tech2dsm@gmail.com"

          # 2. THE FORCE CLEANUP (This fixes your Exit 128 error)
          # We delete the temp JSONs and force-reset so Git doesn't see "unstaged changes"
          rm -f src/client_secrets.json src/service_account.json
          git reset --hard HEAD
          git clean -fd

          # 3. Pull latest and merge your DB changes
          git pull origin main --rebase
          
          # 4. Save the modified files
          git add -f youtube_master.db metadata.csv
          
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "chore: automated sync [skip ci]"
            git push origin main
          else
            echo "No changes detected to sync."
          fi